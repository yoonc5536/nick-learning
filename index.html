<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nick's Play &amp; Learning Hub</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 40px 20px 60px; background: #f4f7fb; color: #1e293b;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { font-size: 2.1rem; margin: 0 0 8px; text-align: center; }
    .sub { color: #64748b; margin: 0 0 8px; text-align: center; font-size: 1.05rem; max-width: 720px; }
    a.back { align-self: flex-start; max-width: 1280px; width: 100%; margin: 0 auto 14px;
      color: #2563eb; text-decoration: none; font-weight: 700; font-size: .95rem; }
    .sections { display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 24px; width: 100%; max-width: 1280px; margin-top: 30px; align-items: start; }
    @media (max-width: 1000px){ .sections{ grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width: 620px){ .sections{ grid-template-columns: 1fr; } }
    .section h2.sec { font-size: 1.3rem; margin: 0 0 12px 4px; }
    .cards { display: grid; gap: 16px; }
    .card { display: block; background: #fff; border-radius: 16px; padding: 22px 24px;
      text-decoration: none; color: inherit; box-shadow: 0 2px 10px rgba(30,41,59,.08);
      border: 1px solid #e2e8f0; transition: transform .12s ease, box-shadow .12s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(30,41,59,.12); }
    .card .emoji { font-size: 2rem; }
    .card h3 { margin: 8px 0 4px; font-size: 1.25rem; }
    .card p { margin: 0; color: #64748b; font-size: .95rem; }
    .card .meta { display:inline-block; margin-top:12px; background:#eef2ff; color:#3730a3;
      font-weight:700; font-size:.82rem; padding:4px 10px; border-radius:999px; }
    footer { margin-top: 44px; color: #94a3b8; font-size: .85rem; text-align:center; }
</style>
</head>
<body>
  <h1>🧸 Nick's Play &amp; Learning Hub</h1>
  <p class="sub">Pick something fun to build and play with today!</p>
  <div class="sections" style="grid-template-columns:1fr; max-width:640px;">
    <div class="section">
      <h2 class="sec">🧩 Toys</h2>
      <div class="cards">
        <a class="card" href="toys/magnetic-tiles/">
          <span class="emoji">🧲</span>
          <h3>Magnetic Tiles</h3>
          <p>Houses, castles, car ramps, ball runs, dominoes, rockets and more — 21 build-along videos to watch and copy.</p>
          <span class="meta">🎬 21 videos · 6 kinds of builds</span>
        </a>
      </div>
    </div>
  </div>
  <footer>Made for Nick &middot; Keep building! 🧲</footer>
</body>
</html>
